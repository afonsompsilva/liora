<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIORA - Galeria de Fotos</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="liorna.png">
</head>

<body>

  <header>
    <div class="logo">LIORA</div>
    <div class="tagline">Afonso Martins Pimentel Silva</div>

  <nav class="categories-bar">
    <a href="#sol" data-cat="sol">Sol</a>
    <a href="#mar" data-cat="mar">Mar</a>
    <a href="#natureza" data-cat="natureza">Natureza</a>
  </nav>
  </header>

  <main class="content">
    <section id="sol" class="category-section">
      <div class="category-header">
        <img src="sol/sol.jpeg" alt="Sol" />
        <div>
          <h2>Sol</h2>
        </div>
      </div>
      <div class="gallery">
        <img src="sol/sol.jpeg" alt="Sol" class="photo-item">
        <img src="sol/sol1.jpeg" alt="Sol 1" class="photo-item" />
        <img src="sol/sol2.jpeg" alt="Sol 2" class="photo-item" />
        <img src="sol/sol3.jpeg" alt="Sol 3" class="photo-item"/>
        <img src="sol/sol4.jpeg" alt="Sol 4" class="photo-item hidden" />
        <img src="sol/sol5.jpeg" alt="Sol 5" class="photo-item hidden" />
      </div>
      <button class="load-more">Ver Mais</button>
    </section>

    <section id="mar" class="category-section">
      <div class="category-header">
        <img src="mar/mar.jpeg" alt="Mar" />
        <div>
          <h2>Mar</h2>
        </div>
      </div>
      <div class="gallery">
        <img src="mar/mar1.jpeg" alt="Mar 1" class="photo-item" />
        <img src="mar/mar2.jpeg" alt="Mar 2" class="photo-item" />
        <img src="mar/mar3.jpeg" alt="Mar 3" class="photo-item" />
        <img src="mar/mar4.jpeg" alt="Mar 4" class="photo-item hidden"/>
        <img src="mar/mar5.jpeg" alt="Mar 5" class="photo-item hidden"/>
        <img src="mar/mar6.jpeg" alt="Mar 6" class="photo-item hidden"/>
        <img src="mar/mar7.jpeg" alt="Mar 7" class="photo-item hidden"/>
      </div>
      <button class="load-more">Ver Mais</button>
    </section>

    <section id="natureza" class="category-section">
      <div class="category-header">
        <img src="natureza/natureza.jpeg" alt="Natureza" />
        <div>
          <h2>Natureza</h2>
        </div>
      </div>
      <div class="gallery">
        <img src="natureza/natureza1.jpeg" alt="Natureza 1" class="photo-item" />
        <img src="natureza/natureza2.jpeg" alt="Natureza 2" class="photo-item" />
        <img src="natureza/natureza3.jpeg" alt="Natureza 3" class="photo-item" />
        <img src="natureza/natureza5.jpeg" alt="Natureza 5" class="photo-item" />
        <img src="natureza/natureza6.jpeg" alt="Natureza 6" class="photo-item" />
        <img src="natureza/natureza7.jpeg" alt="Natureza 7" class="photo-item hidden" />
        <img src="natureza/natureza8.jpeg" alt="Natureza 8" class="photo-item hidden" />
        <img src="natureza/natureza9.jpeg" alt="Natureza 9" class="photo-item hidden" />
        <img src="natureza/natureza10.jpeg" alt="Natureza 10" class="photo-item hidden" />
        <img src="natureza/natureza11.jpeg" alt="Natureza 11" class="photo-item hidden" />
        <img src="natureza/natureza12.jpeg" alt="Natureza 12" class="photo-item hidden" />
        <img src="natureza/natureza13.jpeg" alt="Natureza 13" class="photo-item hidden" />
        <img src="natureza/natureza14.jpeg" alt="Natureza 14" class="photo-item hidden" />
        <img src="natureza/natureza16.jpeg" alt="Natureza 16" class="photo-item hidden" />
      </div>
      <button class="load-more">Ver Mais</button>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-bio">Capturando momentos, contando histórias.</p>
    <p class="footer-slogan">
      <span>Redes Sociais:</span>
      <br>
      <a href="https://instagram.com/afonsompsilva" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-link">Instagram</a> |
      <a href="https://linktr.ee/afonsompsilva" target="_blank" rel="noopener noreferrer" aria-label="Linktree" class="social-link">Linktree</a> |
      <a href="https://pinterest.com/afonsompsilvaa" target="_blank" rel="noopener noreferrer" aria-label="Pinterest" class="social-link">Pinterest</a> |
      <a href="https://tiktok.com/@afonsompsilva" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="social-link">TikTok</a>
    </p>
  </footer>

  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Fechar imagem">×</button>
    <img src="" alt="Imagem Ampliada" id="lightbox-img" />
  </div>

  <script>
  document.querySelectorAll('.category-section').forEach(section => {
    const btn = section.querySelector('.load-more');
    const imgs = Array.from(section.querySelectorAll('.gallery img'));
    const initialVisible = 3; 

    imgs.forEach((img, i) => {
      img.style.display = i < initialVisible ? '' : 'none';
    });

    let visibleCount = initialVisible;

    btn.addEventListener('click', () => {
      if (btn.textContent === 'Ver Mais') {
        visibleCount = imgs.length;
        btn.textContent = 'Ver Menos';

        imgs.forEach((img, i) => {
          img.style.display = i < visibleCount ? '' : 'none';
        });
      } else {
        visibleCount = initialVisible;
        imgs.forEach((img, i) => {
          img.style.display = i < visibleCount ? '' : 'none';
        });
        btn.textContent = 'Ver Mais';
      }
    });
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');

  document.querySelectorAll('.gallery img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('active');
    });
  });

  lightboxClose.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove('active');
    }
  });
  </script>

</body>
</html>
